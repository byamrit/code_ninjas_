<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Movie Night</title>
<style>
  /* ---------- THEME: colors are variables, dark mode just swaps them ---------- */
  :root {
    --bg: #14162b; --card: #1f2245; --text: #eef0ff; --muted: #a3a8d6;
    --accent: #ffc53d; --accent-text: #14162b; --line: #333868;
  }
  [data-theme="light"] {
    --bg: #f1f2fa; --card: #ffffff; --text: #1a1c3a; --muted: #5b6094;
    --accent: #e0a100; --accent-text: #ffffff; --line: #d5d8ee;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; line-height: 1.5; transition: background .3s, color .3s; }
  h1, h2 { font-family: Georgia, serif; }
  button, select, input { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  /* ---------- HEADER ---------- */
  header { display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; padding: 1.5rem 5vw 0.5rem; }
  h1 { font-size: clamp(1.8rem, 5vw, 2.8rem); }
  .top-btns { display: flex; gap: .5rem; }
  .btn { background: var(--card); border: 1px solid var(--line); padding: .5rem 1rem; border-radius: 999px; cursor: pointer; transition: transform .15s, background .15s; }
  .btn:hover { transform: translateY(-2px); }
  .btn.on { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }

  /* ---------- CONTROLS: search, sort, genre chips ---------- */
  .controls { display: flex; flex-wrap: wrap; gap: .75rem; padding: 1rem 5vw; }
  #search, #sort { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: .6rem .9rem; }
  #search { flex: 1 1 240px; }
  .chips { display: flex; flex-wrap: wrap; gap: .5rem; padding: 0 5vw 1rem; }

  /* ---------- MOVIE GRID: auto-fills as many columns as fit ---------- */
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 1.25rem; padding: 0 5vw 3rem; }
  .movie { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; cursor: pointer; transition: transform .2s, box-shadow .2s; display: flex; flex-direction: column; }
  .movie:hover { transform: translateY(-6px); box-shadow: 0 12px 28px rgba(0,0,0,.35); }
  .poster { aspect-ratio: 2/3; display: flex; align-items: flex-end; padding: 1rem; font-family: Georgia, serif; font-size: 1.5rem; font-weight: 700; color: #fff; text-shadow: 0 2px 8px rgba(0,0,0,.5); position: relative; }
  .poster img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .info { padding: .9rem 1rem 1.1rem; display: flex; flex-direction: column; gap: .35rem; }
  .row { display: flex; justify-content: space-between; align-items: center; }
  .rating { color: var(--accent); font-weight: 700; }
  .genres { color: var(--muted); font-size: .85rem; }
  .desc { font-size: .9rem; color: var(--muted); }
  .heart { background: none; border: none; font-size: 1.4rem; cursor: pointer; color: var(--muted); }
  .heart.on { color: #ff5470; }
  #empty { text-align: center; color: var(--muted); padding: 3rem 5vw; display: none; }

  /* ---------- POPUP (uses the built-in <dialog> element) ---------- */
  dialog { background: var(--card); color: var(--text); border: 1px solid var(--line); border-radius: 16px; padding: 0; width: min(560px, 92vw); margin: auto; }
  dialog::backdrop { background: rgba(0,0,0,.65); }
  .modal-body { padding: 1.5rem; display: grid; gap: .75rem; }
  .modal-body .poster { aspect-ratio: 16/8; border-radius: 10px; overflow: hidden; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<header>
  <h1>Movie Night</h1>
  <div class="top-btns">
    <button class="btn" id="watchOnly">My watchlist</button>
    <button class="btn" id="themeBtn" aria-label="Toggle dark mode">Light mode</button>
  </div>
</header>

<div class="controls">
  <input id="search" type="search" placeholder="Search movies by title" aria-label="Search movies by title">
  <select id="sort" aria-label="Sort movies">
    <option value="none">Sort: default</option>
    <option value="high">Rating: high to low</option>
    <option value="low">Rating: low to high</option>
  </select>
</div>
<div class="chips" id="chips"></div>

<main>
  <div id="grid"></div>
  <p id="empty">No movies match. Try a different title or genre.</p>
</main>

<dialog id="modal"></dialog>

<script>
/* ============ 1. DATA: every movie is an object inside one array ============
   To use a real poster, add  poster: "https://...jpg"  to a movie.
   Without it, a colored gradient poster is drawn using "hue".              */
const movies = [
  { id: 1, title: "Inception", year: 2010, rating: 8.8, genres: ["Sci-Fi", "Thriller"], hue: 215, desc: "A thief who steals secrets from dreams is given one impossible job: plant an idea in someone's mind." },
  { id: 2, title: "The Dark Knight", year: 2008, rating: 9.0, genres: ["Action", "Crime"], hue: 260, desc: "Batman faces the Joker, a chaotic criminal who pushes Gotham to its breaking point." },
  { id: 3, title: "Interstellar", year: 2014, rating: 8.7, genres: ["Sci-Fi", "Drama"], hue: 30, desc: "Explorers travel through a wormhole to find a new home for humanity as Earth fades." },
  { id: 4, title: "Se7en", year: 1995, rating: 8.6, genres: ["Crime", "Thriller"], hue: 130, desc: "Two detectives chase a serial killer who bases his crimes on the seven deadly sins." },
  { id: 5, title: "The Matrix", year: 1999, rating: 8.7, genres: ["Sci-Fi", "Action"], hue: 150, desc: "A hacker learns his reality is a simulation and joins a rebellion against the machines." },
  { id: 6, title: "Shutter Island", year: 2010, rating: 8.2, genres: ["Thriller", "Drama"], hue: 195, desc: "A U.S. Marshal investigates a missing patient at a remote hospital for the criminally insane." },
  { id: 7, title: "Fight Club", year: 1999, rating: 8.8, genres: ["Drama", "Thriller"], hue: 350, desc: "An office worker and a soap salesman start an underground club that spirals out of control." },
  { id: 8, title: "Gladiator", year: 2000, rating: 8.5, genres: ["Action", "Drama"], hue: 20, desc: "A betrayed Roman general returns as a gladiator to take revenge on the emperor." }
];

/* ============ 2. STATE: things that change while the user clicks ============ */
const state = {
  query: "",
  genre: "All",
  sort: "none",
  watchOnly: false,
  watchlist: JSON.parse(localStorage.getItem("watchlist") || "[]")   // saved ids
};

/* ============ 3. GRAB ELEMENTS ============ */
const grid = document.getElementById("grid");
const empty = document.getElementById("empty");
const chips = document.getElementById("chips");
const modal = document.getElementById("modal");

/* ============ 4. HELPERS ============ */
function posterHTML(m) {
  const bg = `linear-gradient(160deg, hsl(${m.hue} 60% 38%), hsl(${m.hue + 40} 60% 14%))`;
  // Looks for posters/<title-with-dashes>.jpg, e.g. posters/the-dark-knight.jpg
  // If the file is missing, onerror removes the <img> and the gradient + title shows instead.
  const slug = m.title.toLowerCase().replace(/[^a-z0-9]+/g, "-");
  const src = m.poster || `posters/${slug}.jpg`;
  const img = `<img src="${src}" alt="${m.title} poster" onerror="this.remove()">`;
  return `<div class="poster" style="background:${bg}">${img}<span>${m.title}</span></div>`;
}

/* ============ 5. RENDER: filter -> sort -> draw cards ============ */
function render() {
  let list = movies.filter(m =>
    m.title.toLowerCase().includes(state.query.toLowerCase()) &&      // search
    (state.genre === "All" || m.genres.includes(state.genre)) &&      // genre filter
    (!state.watchOnly || state.watchlist.includes(m.id))              // watchlist filter
  );

  if (state.sort === "high") list.sort((a, b) => b.rating - a.rating);
  if (state.sort === "low") list.sort((a, b) => a.rating - b.rating);

  grid.innerHTML = list.map(m => `
    <article class="movie" data-id="${m.id}" tabindex="0">
      ${posterHTML(m)}
      <div class="info">
        <div class="row"><strong>${m.title}</strong><span class="rating">★ ${m.rating}</span></div>
        <div class="genres">${m.genres.join(", ")} · ${m.year}</div>
        <p class="desc">${m.desc}</p>
        <div class="row"><span></span>
          <button class="heart ${state.watchlist.includes(m.id) ? "on" : ""}" data-heart="${m.id}"
            aria-label="Toggle watchlist for ${m.title}">${state.watchlist.includes(m.id) ? "♥" : "♡"}</button>
        </div>
      </div>
    </article>`).join("");

  empty.style.display = list.length ? "none" : "block";
}

/* ============ 6. GENRE BUTTONS: built from the data, so new genres appear automatically ============ */
function buildChips() {
  const all = ["All", ...new Set(movies.flatMap(m => m.genres))];   // Set removes duplicates
  chips.innerHTML = all.map(g =>
    `<button class="btn ${g === state.genre ? "on" : ""}" data-genre="${g}">${g}</button>`).join("");
}

/* ============ 7. POPUP ============ */
function openModal(id) {
  const m = movies.find(x => x.id === id);
  modal.innerHTML = `<div class="modal-body">
    ${posterHTML(m)}
    <h2>${m.title} (${m.year})</h2>
    <p class="rating">★ ${m.rating} / 10</p>
    <p class="genres">${m.genres.join(", ")}</p>
    <p>${m.desc}</p>
    <button class="btn" id="closeModal">Close</button></div>`;
  modal.showModal();
  document.getElementById("closeModal").onclick = () => modal.close();
}

/* ============ 8. EVENTS ============ */
document.getElementById("search").addEventListener("input", e => { state.query = e.target.value; render(); });
document.getElementById("sort").addEventListener("change", e => { state.sort = e.target.value; render(); });

chips.addEventListener("click", e => {
  const g = e.target.dataset.genre;
  if (!g) return;
  state.genre = g; buildChips(); render();
});

grid.addEventListener("click", e => {
  const heart = e.target.closest("[data-heart]");
  if (heart) {                                   // heart clicked: toggle watchlist, don't open popup
    const id = Number(heart.dataset.heart);
    state.watchlist = state.watchlist.includes(id)
      ? state.watchlist.filter(x => x !== id)
      : [...state.watchlist, id];
    localStorage.setItem("watchlist", JSON.stringify(state.watchlist));
    render();
    return;
  }
  const card = e.target.closest(".movie");
  if (card) openModal(Number(card.dataset.id));
});

grid.addEventListener("keydown", e => {          // keyboard: Enter opens the popup
  if (e.key === "Enter" && e.target.classList.contains("movie")) openModal(Number(e.target.dataset.id));
});

modal.addEventListener("click", e => { if (e.target === modal) modal.close(); });   // click outside closes

document.getElementById("watchOnly").addEventListener("click", e => {
  state.watchOnly = !state.watchOnly;
  e.currentTarget.classList.toggle("on", state.watchOnly);
  render();
});

/* ============ 9. DARK / LIGHT MODE (remembered between visits) ============ */
const themeBtn = document.getElementById("themeBtn");
function setTheme(t) {
  document.documentElement.dataset.theme = t;
  themeBtn.textContent = t === "dark" ? "Light mode" : "Dark mode";
  localStorage.setItem("theme", t);
}
themeBtn.addEventListener("click", () =>
  setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark"));
setTheme(localStorage.getItem("theme") || "dark");

/* ============ 10. START ============ */
buildChips();
render();
</script>
</body>
</html>
